<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampala Flame Grill | Elegant Minimalist Dining</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #161616;
            --bg-card: #1f1f1f;
            --accent: #D4AF37; /* Luxury Gold */
            --accent-hover: #F3E5AB;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --ios-radius: 20px;
            --ios-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 4px;
        }

        /* Subtle Background Animation */
        .ambient-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, 5%) scale(1.1); }
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34c759; /* Active green */
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #34c759;
        }

        /* Hero Section */
        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            z-index: 1;
            margin-top: 80px;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
        }

        .cta-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 16px 36px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition-smooth);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1) 0.6s;
        }

        .cta-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 8px 25px rgba(214, 175, 55, 0.2);
        }

        /* Menu Grid Section */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5% 100px 5%;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 60px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        .menu-card {
            background: var(--bg-secondary);
            border-radius: var(--ios-radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            border-color: rgba(214, 175, 55, 0.2);
            box-shadow: var(--ios-shadow);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            background: #111;
            overflow: hidden;
        }

        .menu-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
            filter: brightness(0.88) contrast(1.05);
        }

        .menu-card:hover .menu-img {
            transform: scale(1.05);
            filter: brightness(1);
        }

        .card-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .item-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .item-price {
            color: var(--accent);
            font-weight: 500;
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .item-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition-smooth);
        }

        .add-btn:hover {
            background: var(--text-main);
            color: var(--bg-primary);
            border-color: var(--text-main);
        }

        /* Integrated Premium Payment Overlay/Footer Bar */
        .cart-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 35px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 90;
            box-shadow: var(--ios-shadow);
            transition: var(--transition-smooth);
        }

        .cart-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .cart-info {
            font-size: 0.95rem;
            font-weight: 400;
        }

        .cart-info span {
            color: var(--accent);
            font-weight: 600;
        }

        .checkout-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .checkout-btn:hover {
